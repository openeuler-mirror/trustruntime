[workspace]
members = [
    "config",
    "inference",
    "log",
    "controller",
    "hook",
    "proxy",
    "proxy_proc",
    "security",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["AgentSandbox Team"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
toml = "0.8"
http = "1"
bytes = "1"
fs2 = "0.4"
notify = "6"
libc = "0.2"
log = "0.4"
aya = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring", "x509-parser"] }
x509-parser = "0.16"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
hyper = { version = "1", default-features = false, features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
globset = "0.4"
http-body-util = "0.1"
http-body = "1"
tempfile = "3.10"
