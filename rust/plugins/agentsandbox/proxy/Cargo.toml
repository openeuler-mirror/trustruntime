[package]
name = "agentsandbox-proxy"
description = "AgentSandbox HTTPS 透明代理库（MITM 过滤与审计，容器端点模型——仅 lib 集成交付）"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# 测试注入缝门禁（facade::testing / logging::testing——生产构建完全编译
# 排除；仅经下方自引用 dev-dependency 对测试构建启用）。
test-util = []

[dependencies]
# 推理路由外部库（AR-005；当前为 mock 空实现，真实库落地后同契约替换）。
agentsandbox-inference = { path = "../inference" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# 仅 lock_util 锁毒化告警使用：绕开 logging::emit 的 CALLBACK 锁防重入
# 死锁（见 lock_util.rs 文档；非日志交付路径）。
log = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring", "x509-parser"] }
x509-parser = "0.16"
tokio = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
hyper = { version = "1", default-features = false, features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
# 单星 glob 匹配（domain/method/uri 中间星形态；特殊字符转义保字面）。
globset = "0.4"
http = "1"
http-body-util = "0.1"
bytes = "1"
http-body = "1"

[dev-dependencies]
tempfile = "3.10"
# 自引用：仅测试构建启用 test-util（fake registry / 日志捕获缝）。
agentsandbox-proxy = { path = ".", features = ["test-util"] }
