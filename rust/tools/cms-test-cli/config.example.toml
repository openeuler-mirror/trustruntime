# CMS 测试工具配置示例
# 用法: cms-test-cli --config /path/to/config.toml

# =============================================================================
# 连接配置
# =============================================================================
[connection]
# vsock CID（可选，默认1=VMADDR_CID_LOCAL）
# 1=VMADDR_CID_LOCAL, 2=VMADDR_CID_HOST, >=3=guest VM
cid = 1
# 目标服务端口（必填）
port = 12345

# =============================================================================
# TLS 客户端证书（用于连接服务端）
# =============================================================================
[tls_client]
# CA证书路径，用于验证服务端证书（必填）
ca_cert = "/tmp/test-certs/tls/ca/ca.crt"

# 客户端证书路径（必填）
client_cert = "/tmp/test-certs/tls/ubse/node-a/server.pem"

# 客户端私钥路径（必填）
client_key = "/tmp/test-certs/tls/ubse/node-a/server_key.pem"

# 私钥密码文件路径（可选，私钥未加密时不需要）
client_key_pwd = "/tmp/test-certs/tls/ubse/node-a/key_pwd.txt"

# =============================================================================
# 测试服务进程配置（用于场景测试）
# =============================================================================
[server]
# trustruntime 二进制路径
binary_path = "trustruntime"