# TrustRuntime Agent Configuration
# 默认配置文件路径: /etc/trustruntime/agent.toml
# 文件权限要求: 640 (root:root)

# =============================================================================
# vsock 通信配置
# =============================================================================
[vsock]
# vsock 端口号（必填）
port = 6174

# 最大并发连接数（可选，默认 16）
# 通过 tokio Semaphore 限流，超过此数量的新连接将等待
# max_connections = 16

# =============================================================================
# 日志配置
# =============================================================================
[log]
# 日志文件路径（必填）
path = "/var/log/trustruntime/trustruntime.log"

# 日志级别（可选，默认 "info"）
# 可选值: "info", "warn", "error"
# RUST_LOG 环境变量可覆盖此配置
# level = "info"

# 单个日志文件最大大小，单位 MB（必填）
max_file_size = 10

# 日志回滚文件个数（必填）
# 超过此数量的旧日志文件将被自动删除
max_roll_count = 10
